        </div>
      );

                    </select>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
                    <span style={{ color:T.dim, fontSize:"12px" }}>الفيدباك:</span>
                    <select value={filterPref} onChange={e=>setFilterPref(e.target.value)}
                      style={{ background:T.bg, border:`1px solid ${T.border}`, borderRadius:"6px", padding:"5px 8px", color:T.text, fontSize:"12px" }}>
                      <option value="all">الكل</option>
                      <option value="online">Session online</option>
                      <option value="1:1">Feedback 1:1</option>
                      <option value="site">Session on site</option>
                    </select>
                  </div>
                  <span style={{ color:T.muted, fontSize:"11px", marginRight:"auto" }}>عرض {filtered.length} من {ALL.length}</span>
                </div>

                <div style={{ ...cardS, padding:"0", overflow:"hidden" }}>
                  <div style={{ overflowX:"auto", overflowY:"auto", maxHeight:"calc(100vh - 280px)" }}>
                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
                      <thead>
                        <tr style={{ background:T.bg, borderBottom:`1px solid ${T.border}`, position:"sticky", top:0 }}>
                          {["#","الاسم","HR-Code","Team","الوضوح","صُحح له","يحتاج أمثلة","الفيدباك","💬"].map(h => (
                            <th key={h} style={{ padding:"10px 14px", textAlign:"right", color:T.dim, fontWeight:"500", whiteSpace:"nowrap" }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {filtered.map((r, i) => (
                          <tr key={r.id} style={{ borderBottom:`1px solid ${T.border}`, background: i%2===0 ? "transparent" : "rgba(255,255,255,0.015)" }}>
                            <td style={{ padding:"9px 14px", color:T.dim }}>{r.id}</td>
                            <td style={{ padding:"9px 14px", color:T.text, whiteSpace:"nowrap" }}>{r.name || <span style={{ color:T.dim }}>—</span>}</td>
                            <td style={{ padding:"9px 14px", color:T.muted, fontFamily:"monospace", fontSize:"11px" }}>{r.hr || "—"}</td>
                            <td style={{ padding:"9px 14px" }}>
                              {r.team ? <span style={{ background:`${T.accent}20`, color:T.accent, padding:"2px 7px", borderRadius:"4px", fontSize:"11px" }}>{r.team}</span> : <span style={{ color:T.dim }}>—</span>}
                            </td>
                            <td style={{ padding:"9px 14px" }}><Badge label={CL_LABEL[r.cl]} color={CL_COLOR[r.cl]} /></td>
                            <td style={{ padding:"9px 14px", color:T.muted, maxWidth:"160px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.corrected}</td>
                            <td style={{ padding:"9px 14px" }}>
                              {r.needs !== "none" ? <span style={{ color:"#f59e0b", fontSize:"11px" }}>{r.needs}</span> : <span style={{ color:T.dim }}>مفيش</span>}
                            </td>
                            <td style={{ padding:"9px 14px" }}>
                              <span style={{ color: PREF_COLOR[r.pref] || T.muted, fontSize:"11px" }}>
                                {r.pref === "1:1" ? "1:1" : r.pref === "online" ? "Online" : r.pref === "site" ? "On site" : "—"}
                              </span>
                            </td>
                            <td style={{ padding:"9px 14px", textAlign:"center" }}>{r.note && "💬"}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {tab === "overview" && (
              <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"12px" }}>
                  {[
                    { v:"82.5%", l:"واضح جداً", s:"66 من 80", c:"#22c55e" },
                    { v:"71%",   l:"سرعة اللقطة", s:"السبب الأول للصعوبة", c:"#ef4444" },
                    { v:"17",   l:"Positioning Duel", s:"الأكثر محتاجين تصحيح", c:"#f59e0b" },
                    { v:"50%",  l:"Session online", s:"الفيدباك المفضل", c:"#3b82f6" },
                  ].map((k,i) => (
                    <div key={i} style={cardS}>
                      <div style={{ fontSize:"28px", fontWeight:"700", color:k.c }}>{k.v}</div>
                      <div style={{ fontSize:"12px", fontWeight:"600", color:T.text, marginTop:"5px" }}>{k.l}</div>
                      <div style={{ fontSize:"11px", color:T.dim, marginTop:"2px" }}>{k.s}</div>
                    </div>
                  ))}
                </div>

                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"16px" }}>
                  {[
                    { title:"وضوح شرح الأيفنتات", data:[{label:"واضح جداً",n:66,color:"#22c55e"},{label:"واضح إلى حد ما",n:12,color:"#f59e0b"},{label:"غير واضح",n:2,color:"#ef4444"}], max:80 },
                    { title:"طريقة الفيدباك المفضلة", data:[{label:"Session online",n:40,color:"#3b82f6"},{label:"Feedback one to one",n:31,color:"#8b5cf6"},{label:"Session on site",n:8,color:"#22c55e"}], max:80 },
                    { title:"الأيفنتات اللي الفيديو صحح فهمها", data:[{label:"لا — فاهمهم صح",n:55,color:"#22c55e"},{label:"Positioning Duel",n:17,color:"#f59e0b"},{label:"Separation Duel",n:11,color:"#f97316"},{label:"Hold up",n:8,color:"#8b5cf6"},{label:"Leg Stretch",n:4,color:"#06b6d4"}], max:60 },
                    { title:"الأيفنت اللي لسه محتاج أمثلة", data:[{label:"مفيش — كل الأيفنتات واضحة",n:64,color:"#22c55e"},{label:"Positioning Duel",n:9,color:"#f59e0b"},{label:"Separation Duel",n:4,color:"#f97316"},{label:"Hold up",n:2,color:"#8b5cf6"},{label:"Leg Stretch",n:2,color:"#06b6d4"}], max:80 },
                  ].map((sec, si) => (
                    <div key={si} style={cardS}>
                      <div style={{ fontWeight:"600", marginBottom:"14px" }}>{sec.title}</div>
                      {sec.data.map((d,i) => (
                        <div key={i} style={{ marginBottom:"9px" }}>
                          <div style={{ display:"flex", justifyContent:"space-between", fontSize:"12px", marginBottom:"4px" }}>
                            <span style={{ color:d.color, fontWeight:"500" }}>{d.n} ({Math.round(d.n/80*100)}%)</span>
                            <span style={{ color:T.muted }}>{d.label}</span>
                          </div>
                          <div style={{ height:"5px", borderRadius:"3px", background:T.border }}>
                            <div style={{ height:"5px", borderRadius:"3px", width:`${d.n/sec.max*100}%`, background:d.color }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>

                <div style={{ background:"rgba(239,68,68,0.07)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:"12px", padding:"16px 20px" }}>
                  <div style={{ fontWeight:"700", color:"#ef4444", marginBottom:"6px" }}>🚨 Signal بارز في التعليقات المفتوحة (15+ شخص)</div>
                  <div style={{ fontSize:"12px", color:T.muted, lineHeight:"1.7" }}>
                    السبب الحقيقي لانخفاض الكواليتي حسب الكوليكتورز ليس عدم فهم الأيفنتات، بل <strong style={{ color:"#f87171" }}>زيادة التاسك من 7.5 إلى 1 Wan مع ضغط الـ SLA</strong>. يتكرر في أكثر من 15 تعليق مكتوب ويحتاج رفعه للإدارة.
                  </div>
                </div>
              </div>
            )}

            {tab === "teams" && (
              <div style={{ display:"flex", flexDirection:"column", gap:"14px" }}>
                <div style={{ ...cardS, padding:"0", overflow:"hidden" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
                    <thead>
                      <tr style={{ background:T.bg, borderBottom:`1px solid ${T.border}` }}>
                        {["Team","إجمالي","واضح جداً","إلى حد ما","غير واضح","% وضوح"].map(h => (
                          <th key={h} style={{ padding:"10px 16px", textAlign:"right", color:T.dim, fontWeight:"500" }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {teamStats.map((t, i) => {
                        const p = Math.round(t.clear / t.total * 100);
                        const barColor = p >= 90 ? "#22c55e" : p >= 70 ? "#f59e0b" : "#ef4444";
                        return (
                          <tr key={t.team} style={{ borderBottom:`1px solid ${T.border}`, background: i%2===0 ? "transparent" : "rgba(255,255,255,0.015)" }}>
                            <td style={{ padding:"10px 16px" }}><span style={{ background:`${T.accent}20`, color:T.accent, padding:"3px 10px", borderRadius:"6px", fontWeight:"600" }}>Team {t.team}</span></td>
                            <td style={{ padding:"10px 16px", color:T.text, fontWeight:"600" }}>{t.total}</td>
                            <td style={{ padding:"10px 16px", color:"#22c55e" }}>{t.clear}</td>
                            <td style={{ padding:"10px 16px", color:"#f59e0b" }}>{t.partial || "—"}</td>
                            <td style={{ padding:"10px 16px", color:"#ef4444" }}>{t.unclear || "—"}</td>
                            <td style={{ padding:"10px 16px" }}>
                              <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
                                <div style={{ height:"6px", width:"80px", borderRadius:"3px", background:T.border }}>
                                  <div style={{ height:"6px", borderRadius:"3px", width:`${p}%`, background:barColor }} />
                                </div>
                                <span style={{ color:barColor, fontWeight:"600" }}>{p}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
